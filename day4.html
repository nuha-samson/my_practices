        // 1. Get all applicants with entranceExam above 500

        // 2. Get all applicants whose grade12 score is above 90

);

  const score = applicants.map(

   const department = applicants.map(

    );

        // ==========================================

        // 9. Sort applicants from lowest entrance score to highest
const des = applicants.sort((a,b) => a.entranceExam > b.entranceExam ? 1 : -1
)

        // 10. Sort applicants from highest entrance score to lowest

    )

        // 11. Sort applicants by grade12 score

    )

        // 12. Sort applicants alphabetically by first name

    )
console.table(alpha)


        // ==========================================

        // 13. Calculate the total entranceExam score

        const total = applicants.reduce(
            function(sum, a) {
            return sum += a.entranceExam
        }
        , 0);
