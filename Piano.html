<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Piano</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            background:
                radial-gradient(circle at top, #2d2d2d, #111);

            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }

        h1 {
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            color: #bdbdbd;
            margin-bottom: 40px;
        }

        .piano {
            position: relative;
            display: flex;
        }

        .white-key {
            width: 90px;
            height: 320px;

            background: white;
            border: 2px solid #222;

            display: flex;
            justify-content: center;
            align-items: flex-end;

            padding-bottom: 20px;

            cursor: pointer;

            transition: all .07s ease;
        }

        .white-key kbd {
            color: #333;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .black-key {
            position: absolute;

            width: 60px;
            height: 200px;

            background: #111;
            border: 2px solid #000;

            border-radius: 0 0 10px 10px;

            display: flex;
            justify-content: center;
            align-items: flex-end;

            padding-bottom: 15px;

            color: white;
            cursor: pointer;

            z-index: 2;

            transition: all .07s ease;
        }

        .black-key kbd {
            font-size: 1rem;
        }

        .playing {
            transform: translateY(8px);
            box-shadow: 0 0 20px gold;
        }

        .black-key.playing {
            background: #ffc107;
            color: black;
        }

        .white-key.playing {
            background: #ffe082;
        }

        .c-sharp {
            left: 60px;
        }

        .d-sharp {
            left: 150px;
        }

        .f-sharp {
            left: 330px;
        }

        .g-sharp {
            left: 420px;
        }

        .a-sharp {
            left: 510px;
        }

        @media(max-width:900px) {

            .white-key {
                width: 60px;
                height: 240px;
            }

            .black-key {
                width: 40px;
                height: 150px;
            }

            .c-sharp {
                left: 40px;
            }

            .d-sharp {
                left: 100px;
            }

            .f-sharp {
                left: 220px;
            }

            .g-sharp {
                left: 280px;
            }

            .a-sharp {
                left: 340px;
            }
        }
    </style>
</head>

<body>
