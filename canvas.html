<h1>LEARN CANVAS</H1>
<canvas id="rectangle" width="200" height="100" style="border:1px solid #f6a4b8; border-width:60px;">
</canvas>
<canvas id="myCanvas" width="200" height="100" style="border:1px solid #d3d3d3;">
</canvas>
<canvas id="square" width="605" height="500" style="border:1px solid #414141; background:black; ">
</canvas>
<script>

var c = document.getElementById("rectangle");
var ctx = c.getContext("2d");
ctx.moveTo(0,0);
ctx.lineTo(200,100);
ctx.stroke();
var c = document.getElementById("rectangle");
var ctx = c.getContext("2d");
ctx.beginPath();
ctx.arc(95,50,40,0,2*Math.PI);
ctx.stroke();


var c = document.getElementById("myCanvas");
var ctx = c.getContext("2d");
ctx.font = "30px Arial";
ctx.fillText("Hello World",10,50);
</script>
<script>
/* 
    MY 
       NEW
	       ROBOT
                 */
var c = document.getElementById("square");
var ctx = c.getContext("2d");
//body
ctx.rect(150, 200, 150, 150);
ctx.fillStyle="silver";
ctx.fill();
ctx.beginPath();
ctx.moveTo(150,200);
ctx.lineTo(300, 350);
ctx.stroke();
//face
ctx.beginPath();
ctx.rect(100, 100, 250, 100);
ctx.fillStyle="gray";
ctx.fill();
//left eye
ctx.beginPath();
ctx.arc(150, 150, 25, 0, 2*Math.PI);
ctx.fillStyle="black";
ctx.fill();
//right eye
ctx.beginPath();
ctx.arc(300, 150, 25, 0, 2*Math.PI);
ctx.fillStyle="black";
ctx.fill();
//mouth
ctx.beginPath();
ctx.rect(200, 160, 50, 25);
ctx.fillStyle="black";
ctx.fill();
ctx.beginPath();
ctx.rect(210, 166, 30, 12.5);
ctx.fillStyle="blue";
ctx.fill();
//right leg
ctx.beginPath();
ctx.rect(250, 350, 50, 120);
ctx.fillStyle="red";
ctx.fill();
//left leg
ctx.beginPath();
ctx.rect(150, 350, 50, 120);
ctx.fillStyle="red";
ctx.fill();
//right hand
ctx.beginPath();
ctx.rect(300, 250, 120, 50);
ctx.fillStyle="red";
ctx.fill();
//left hand
ctx.beginPath();
ctx.rect(30, 250, 120, 50);
ctx.fillStyle="red";
ctx.fill();
//antenna
ctx.beginPath();
ctx.rect(220, 50, 10, 50);
ctx.fillStyle="blue";
ctx.fill();
ctx.beginPath();
ctx.arc(225, 40, 10, 0, 2*Math.PI);
ctx.fillStyle="red";
ctx.fill();
//right lens
ctx.beginPath();
ctx.arc(300, 150, 15, 0, 2*Math.PI);
ctx.fillStyle="red";
ctx.fill();
//left lens
ctx.beginPath();
ctx.arc(150, 150, 15, 0, 2*Math.PI);
ctx.fillStyle="red";
ctx.fill();

//cloud 1
ctx.beginPath();
ctx.arc(525, 150, 80, 0, 2*Math.PI);
ctx.fillStyle="white";
ctx.fill();
//cloud 2
ctx.beginPath();
ctx.arc(430, 200, 20, 0, 2*Math.PI);
ctx.fillStyle="white";
ctx.fill();
//cloud 3
ctx.beginPath();
ctx.arc(400, 210, 5, 0, 2*Math.PI);
ctx.fillStyle="white";
ctx.fill();
//MY ROBOT
ctx.beginPath();
ctx.font = "30px Arial";
ctx.fillText("Hello World",450, 150);
ctx.fillStyle="red";
ctx.fill();
</script>
